<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorador de prompts WildChat</title></head><body style="margin:0">
<title>Explorador de prompts WildChat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E6ECEF; --ink:#14212A; --ink-2:#44525E; --muted:#6B7A86;
  --line:#D3DBE0; --accent:#0B6E73; --accent-ink:#FFFFFF; --accent-soft:#CFE6E7; --bar:#9CC3C6;
  --mark:#FFF1B8; --focus:#0B6E73;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --surface-2:#1F2D36; --ink:#E6EDF1; --ink-2:#B3C0C9; --muted:#8392A0;
  --line:#2B3A44; --accent:#5CC4C9; --accent-ink:#06282B; --accent-soft:#1B4247; --bar:#2E6E73;
  --mark:#5B4B12; --focus:#5CC4C9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --surface-2:#1F2D36; --ink:#E6EDF1; --ink-2:#B3C0C9; --muted:#8392A0;
  --line:#2B3A44; --accent:#5CC4C9; --accent-ink:#06282B; --accent-soft:#1B4247; --bar:#2E6E73;
  --mark:#5B4B12; --focus:#5CC4C9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-2);margin:4px 0 0;max-width:62ch}
.sub b{color:var(--ink);font-weight:600}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* barra lateral */
aside.facets{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px;
  position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){aside.facets{position:static;max-height:none;display:none}body.show-f aside.facets{display:block}.btn-f{display:inline-flex!important}}
.btn-f{display:none;align-items:center;gap:8px;margin-bottom:12px}
.facets-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px}
.facets-head strong{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:600}
.linkbtn:disabled{color:var(--muted);cursor:default;font-weight:400}
fieldset{border:0;margin:0;padding:10px 0 2px;min-width:0}
legend{padding:0;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;
  display:flex;justify-content:space-between;width:100%}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-radius:6px;padding:5px 6px;margin-top:2px;cursor:pointer;position:relative}
.opt:hover{background:var(--surface-2)}
.opt .lbl{display:flex;align-items:center;gap:7px;min-width:0}
.opt .lbl span:last-child{overflow-wrap:anywhere}
.opt .n{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.opt .track{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.opt .fill{display:block;height:100%;background:var(--bar);border-radius:2px;transition:width .15s}
.opt[aria-pressed="true"]{background:var(--accent-soft)}
.opt[aria-pressed="true"] .fill{background:var(--accent)}
.opt .box{flex:none;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;display:grid;place-items:center}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.opt.zero{opacity:.55}
.code{font-family:var(--font-mono);font-size:12px}
.cat-h{font-size:11px;color:var(--muted);margin:8px 0 0 6px;letter-spacing:.03em}

/* barra de controles */
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.switch{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .tg{width:34px;height:20px;border-radius:10px;background:var(--surface-2);border:1px solid var(--muted);position:relative;flex:none;transition:background .15s}
.switch .tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked + .tg{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .tg::after{transform:translateX(14px);background:var(--accent-ink)}
.switch input:focus-visible + .tg{outline:2px solid var(--focus);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* resumen */
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.hidden-note{flex:1 1 220px;align-self:center;color:var(--ink-2);font-size:13px}

/* pestañas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}

/* lista de prompts */
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item .p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;max-width:90ch}
.item .p.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item .more{margin:-4px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-2)}
.tag{background:var(--surface-2);border-radius:5px;padding:2px 7px;white-space:nowrap}
.tag.warn{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.tag.dim{font-family:var(--font-mono);font-size:11px;background:transparent;border:1px solid var(--line)}
.hash{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:auto;cursor:pointer;background:none;border:0;padding:0}
mark{background:var(--mark);color:inherit;border-radius:2px}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;color:var(--ink-2)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}

/* matriz */
.pivot-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:10px}
.pivot-ctl label{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.scroll-x{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.pv{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.pv th,.pv td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.pv th:first-child,.pv td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.pv thead th{font-size:12px;color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
.pv td.c{position:relative}
.pv td.c .cellbg{position:absolute;inset:2px;background:var(--bar);border-radius:4px;opacity:0}
.pv td.c span{position:relative}
.pv tr:last-child td,.pv tr:last-child th{border-bottom:0}
.pv .tot{font-weight:600}
.note{color:var(--muted);font-size:12px;margin-top:10px;max-width:90ch}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Explorador de prompts WildChat</h1>
      <p class="sub">Primeros mensajes de usuarios reales de WildChat en español, clasificados por tipo de tarea, dominio y categoría con un juez LLM (v13.1).</p>
      <p class="sub" id="paises-note"></p>
    </div>
    <button class="btn" id="btn-xlsx" disabled>Descargar Excel</button>
  </header>

  <div class="layout">
    <div><button class="btn ghost btn-f" id="btn-f" aria-expanded="false">Filtros</button>
    <aside class="facets" id="facets" aria-label="Filtros"></aside></div>

    <main>
      <div class="controls">
        <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Buscar en el texto del prompt" autocomplete="off" aria-label="Buscar en el texto del prompt"></label>
        <label class="switch" title="Oculta los prompts descartados por ruido y los repetidos">
          <input type="checkbox" id="clean" checked><span class="tg"></span><span>Quitar ruido y repetidos</span>
        </label>
      </div>

      <section class="stats" aria-live="polite">
        <div class="stat"><b id="s-total">–</b><span>prompts con estos filtros</span></div>
        <div class="hidden-note" id="s-hid"></div>
      </section>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-list" aria-selected="true">Prompts</button>
        <button class="tab" role="tab" id="tab-pivot" aria-selected="false">Matriz de conteos</button>
      </div>

      <section id="view-list"></section>
      <section id="view-pivot" hidden></section>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(async function(){
"use strict";
let D; try{ D = await fetch("datos.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }); }catch(e){ document.body.insertAdjacentHTML("afterbegin","<p style=\"padding:24px;font:16px sans-serif\">No se pudo cargar <b>datos.json</b>. Abre la página desde GitHub Pages o un servidor local (no con doble clic).</p>"); return; }
const P = D.paises, DO = D.dominios, CA = D.categorias, TA = D.tareas, R = D.filas;
const DIMS = {SES:"Nivel socioeconómico",ERI:"Identidad etnorracial",SG:"Sexo-género",PO:"Lugar de origen",LS:"Etapa de vida",BC:"Creencias o convicciones",PA:"Apariencia física",SO:"Orientación sexual"};
const DIMKEYS = Object.keys(DIMS);
const N = R.length;

const cP = new Uint8Array(N), cD = new Uint8Array(N), cT = new Uint8Array(N), cC = new Uint8Array(N), cE = new Uint8Array(N), cF = new Uint8Array(N);
const cDim = new Uint16Array(N); 
const lower = new Array(N);
const tdim = TA.map(t => t.d.reduce((m,k)=>m|(1<<DIMKEYS.indexOf(k)),0));
for(let i=0;i<N;i++){const r=R[i];cP[i]=r[0];cD[i]=r[1];cT[i]=r[2];cC[i]=TA[r[2]].c;cE[i]=r[3];cF[i]=r[4];cDim[i]=tdim[r[2]];lower[i]=r[6].toLowerCase();}

const FACETS = [
  {key:"p", title:"País", labels:P, col:cP},
  {key:"d", title:"Dominio", labels:DO, col:cD},
  {key:"c", title:"Categoría", labels:CA, col:cC},
  {key:"t", title:"Tipo de tarea", labels:TA.map(t=>t.n), col:cT, group:i=>CA[TA[i].c]},
  {key:"m", title:"Dimensiones de sesgo (Tabla 2)", labels:DIMKEYS, col:null, mask:true, tip:k=>DIMS[k], mono:true}
];
const sel = {}; FACETS.forEach(f=>sel[f.key]=new Set());
const state = {q:"", clean:true, tab:"list", page:0, expanded:new Set(), pvRow:"c", pvCol:"p"};
const PAGE = 40;

const fmt = n => n.toLocaleString("es-CL");
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("paises-note").innerHTML = "<b>Países procesados:</b> "+P.slice(0,-1).join(", ")+" y "+P[P.length-1]+". No son todos los países de Latinoamérica: el resto aún no se ha procesado.";

function matches(i, skip){
  if(state.clean && cF[i]!==0) return false;
  if(state.q && lower[i].indexOf(state.q)===-1) return false;
  for(const f of FACETS){
    if(f.key===skip) continue;
    const s = sel[f.key]; if(!s.size) continue;
    if(f.mask){ let ok=false; for(const k of s){ if(cDim[i] & (1<<k)){ok=true;break;} } if(!ok) return false; }
    else if(!s.has(f.col[i])) return false;
  }
  return true;
}
function counts(f){ 
  const out = new Array(f.labels.length).fill(0);
  for(let i=0;i<N;i++){
    if(!matches(i,f.key)) continue;
    if(f.mask){ for(let k=0;k<f.labels.length;k++) if(cDim[i]&(1<<k)) out[k]++; }
    else out[f.col[i]]++;
  }
  return out;
}
function filtered(){ const a=[]; for(let i=0;i<N;i++) if(matches(i)) a.push(i); return a; }


function renderFacets(){
  const root = $("facets");
  const any = FACETS.some(f=>sel[f.key].size) || state.q;
  let h = `<div class="facets-head"><strong>Filtros</strong><button class="linkbtn" id="clear" ${any?"":"disabled"}>Limpiar</button></div>`;
  for(const f of FACETS){
    const cs = counts(f), max = Math.max(1,...cs);
    h += `<fieldset><legend>${f.title}</legend>`;
    let lastGroup = null;
    f.labels.forEach((lab,i)=>{
      if(f.group){ const g=f.group(i); if(g!==lastGroup){h+=`<div class="cat-h">${g}</div>`;lastGroup=g;} }
      const on = sel[f.key].has(i);
      const tip = f.tip ? ` title="${esc(f.tip(lab))}"` : "";
      h += `<button class="opt${cs[i]===0&&!on?" zero":""}" data-f="${f.key}" data-i="${i}" aria-pressed="${on}"${tip}>
        <span class="lbl"><span class="box" aria-hidden="true"></span><span class="${f.mono?"code":""}">${esc(lab)}${f.mask?` <span style="color:var(--muted);font-family:var(--font-body)">· ${esc(DIMS[lab])}</span>`:""}</span></span>
        <span class="n">${fmt(cs[i])}</span>
        <span class="track"><span class="fill" style="width:${(100*cs[i]/max).toFixed(1)}%"></span></span></button>`;
    });
    h += `</fieldset>`;
  }
  const st = root.scrollTop; root.innerHTML = h; root.scrollTop = st;
  const nAct = FACETS.reduce((a,f)=>a+sel[f.key].size,0) + (state.q?1:0);
  $("btn-f").textContent = (document.body.classList.contains("show-f")?"Ocultar filtros":"Filtros") + (nAct?` (${nAct} activos)`:"");
}
$("facets").addEventListener("click", e=>{
  const b = e.target.closest(".opt");
  if(b){ const s=sel[b.dataset.f], i=+b.dataset.i; s.has(i)?s.delete(i):s.add(i); state.page=0; update(); return; }
  if(e.target.id==="clear"){ FACETS.forEach(f=>sel[f.key].clear()); state.q=""; $("q").value=""; state.page=0; update(); }
});

/* ---------- resumen ---------- */
function renderStats(rows){
  $("s-total").textContent = fmt(rows.length);
  let hid = 0;
  if(state.clean){ const was=state.clean; state.clean=false; for(let i=0;i<N;i++) if(cF[i]!==0 && matches(i)) hid++; state.clean=was; }
  $("s-hid").textContent = state.clean
    ? (hid ? `${fmt(hid)} prompts más quedan ocultos por ser ruido o estar repetidos.` : "")
    : "Se muestran también los prompts de ruido y los repetidos.";
  $("btn-xlsx").disabled = rows.length===0;
}


function hl(text, q){
  if(!q) return esc(text);
  const t=text.toLowerCase(); let out="", pos=0, j;
  while((j=t.indexOf(q,pos))!==-1){ out+=esc(text.slice(pos,j))+"<mark>"+esc(text.slice(j,j+q.length))+"</mark>"; pos=j+q.length; }
  return out+esc(text.slice(pos));
}
function renderList(rows){
  const root = $("view-list");
  if(!rows.length){ root.innerHTML = `<div class="empty">Ningún prompt cumple estos filtros. Prueba quitar alguno o limpiar la búsqueda.</div>`; return; }
  const pages = Math.ceil(rows.length/PAGE); if(state.page>=pages) state.page=pages-1;
  const slice = rows.slice(state.page*PAGE,(state.page+1)*PAGE);
  let h = "";
  for(const i of slice){
    const r=R[i], t=TA[r[2]], long = r[6].length>360 && !state.expanded.has(i);
    const flag = cF[i]===0?"":(cF[i]===1?"ruido":cF[i]===2?"repetido":"ruido y repetido");
    h += `<article class="item"><p class="p${long?" clamp":""}">${hl(r[6],state.q)}</p>${r[6].length>360?`<p class="more"><button class="linkbtn" data-more="${i}">${long?"Ver completo":"Ver menos"}</button></p>`:""}
      <div class="meta"><span class="tag">${esc(P[r[0]])}</span><span class="tag">${esc(DO[r[1]])}</span><span class="tag">${esc(CA[t.c])}</span><span class="tag">${esc(t.n)}</span>
      ${t.d.map(k=>`<span class="tag dim" title="${esc(DIMS[k])}">${k}</span>`).join("")}
      ${flag?`<span class="tag warn">${flag}</span>`:""}
      <button class="hash" data-hash="${r[5]}" title="Copiar conversation_hash">${r[5].slice(0,10)}…</button></div></article>`;
  }
  h += `<div class="pager"><span>Mostrando ${fmt(state.page*PAGE+1)}–${fmt(state.page*PAGE+slice.length)} de ${fmt(rows.length)}</span>
    <span><button class="btn ghost" data-pg="-1" ${state.page===0?"disabled":""}>Anterior</button> <span style="margin:0 6px">Página ${state.page+1} de ${pages}</span> <button class="btn ghost" data-pg="1" ${state.page>=pages-1?"disabled":""}>Siguiente</button></span></div>`;
  root.innerHTML = h;
}
$("view-list").addEventListener("click", e=>{
  const m=e.target.closest("[data-more]"); if(m){const i=+m.dataset.more; state.expanded.has(i)?state.expanded.delete(i):state.expanded.add(i); renderList(CUR); return;}
  const pg=e.target.closest("[data-pg]"); if(pg){ state.page+=+pg.dataset.pg; renderList(CUR); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const hs=e.target.closest("[data-hash]"); if(hs){ copy(hs.dataset.hash); }
});
function copy(t){
  const done = ()=>toast("conversation_hash copiado");
  try{ navigator.clipboard.writeText(t).then(done,()=>toast(t)); }catch(_){ toast(t); }
}
let toastT; function toast(m){ let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

/* ---------- matriz ---------- */
const AXES = {p:{n:"País",labels:P,f:i=>cP[i]},d:{n:"Dominio",labels:DO,f:i=>cD[i]},c:{n:"Categoría",labels:CA,f:i=>cC[i]},t:{n:"Tipo de tarea",labels:TA.map(t=>t.n),f:i=>cT[i]}};
function renderPivot(rows){
  const A=AXES[state.pvRow], B=AXES[state.pvCol];
  const opt = k => Object.keys(AXES).map(x=>`<option value="${x}" ${x===k?"selected":""}>${AXES[x].n}</option>`).join("");
  const m = A.labels.map(()=>new Array(B.labels.length).fill(0));
  for(const i of rows) m[A.f(i)][B.f(i)]++;
  const rt = m.map(r=>r.reduce((a,b)=>a+b,0)), ct = B.labels.map((_,j)=>m.reduce((a,r)=>a+r[j],0)), tot = rt.reduce((a,b)=>a+b,0);
  const mx = Math.max(1,...m.flat());
  let h = `<div class="pivot-ctl"><label>Filas <select id="pv-r">${opt(state.pvRow)}</select></label><label>Columnas <select id="pv-c">${opt(state.pvCol)}</select></label></div>`;
  h += `<div class="scroll-x"><table class="pv"><thead><tr><th>${A.n} / ${B.n}</th>${B.labels.map(l=>`<th>${esc(l)}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  m.forEach((r,i)=>{ h += `<tr><td>${esc(A.labels[i])}</td>${r.map(v=>`<td class="c"><span class="cellbg" style="opacity:${v?(0.2+0.8*v/mx).toFixed(2):0}"></span><span>${v?fmt(v):"·"}</span></td>`).join("")}<td class="tot">${fmt(rt[i])}</td></tr>`; });
  h += `<tr><td class="tot">Total</td>${ct.map(v=>`<td class="tot">${fmt(v)}</td>`).join("")}<td class="tot">${fmt(tot)}</td></tr></tbody></table></div>`;
  h += `<p class="note">La matriz usa los mismos filtros de la izquierda y el interruptor de ruido. El tono marca dónde se concentran más prompts.</p>`;
  $("view-pivot").innerHTML = h;
  $("pv-r").onchange = e=>{state.pvRow=e.target.value; renderPivot(CUR);};
  $("pv-c").onchange = e=>{state.pvCol=e.target.value; renderPivot(CUR);};
}

/* ---------- Excel ---------- */
function filtersText(){
  const out=[];
  if(state.q) out.push(["Texto contiene", state.q]);
  FACETS.forEach(f=>{ if(sel[f.key].size) out.push([f.title,[...sel[f.key]].sort((a,b)=>a-b).map(i=>f.labels[i]).join(", ")]); });
  out.push(["Ruido y repetidos", state.clean ? "Ocultos" : "Incluidos"]);
  return out;
}
const BAD = /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g;
let dl = null;
function blobDownload(buf,name){ const u=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function exportXlsx(){
  if(!window.XLSX){ toast("No se pudo cargar la librería de Excel en esta vista."); return; }
  if(!dl && window.claude && window.claude.use){ try{ dl = await window.claude.use("downloads"); }catch(_){} }
  const rows = CUR; if(!rows.length) return;
  const head = ["País","Dominio","Categoría","Tipo de tarea","Dimensiones de sesgo (Tabla 2)","Elegible","Estado","conversation_hash","Prompt"];
  const estado = f => f===0?"Válido":f===1?"Ruido":f===2?"Repetido":"Ruido y repetido";
  const aoa = [head];
  for(const i of rows){ const r=R[i], t=TA[r[2]];
    aoa.push([P[r[0]],DO[r[1]],CA[t.c],t.n,t.d.join(", "),r[3]?"Sí":"No",estado(r[4]),r[5],r[6].replace(BAD,"").slice(0,32000)]); }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [9,20,19,30,24,9,16,34,100].map(w=>({wch:w}));
  ws["!autofilter"] = {ref:`A1:I${aoa.length}`};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Prompts");
  const info = [["Filtro","Valor"],...filtersText(),["Filas exportadas", rows.length],["Fecha", new Date().toISOString().slice(0,10)]];
  const wi = XLSX.utils.aoa_to_sheet(info); wi["!cols"]=[{wch:34},{wch:70}];
  XLSX.utils.book_append_sheet(wb, wi, "Filtros aplicados");
  const buf = XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const name = "prompts_filtrados_"+rows.length+".xlsx";
  if(!dl){ blobDownload(buf,name); toast("Excel generado: "+name); return; }
  try{ await dl.save({filename:name, data:buf}); toast("Excel listo: "+name); }
  catch(err){ if(err && err.code==="declined") return; toast("No se pudo guardar el archivo ("+(err&&err.code||"error")+")."); }
}
$("btn-xlsx").addEventListener("click", exportXlsx);
$("btn-f").addEventListener("click", ()=>{ const on=document.body.classList.toggle("show-f"); $("btn-f").setAttribute("aria-expanded",on); renderFacets(); });

/* ---------- ciclo ---------- */
let CUR = [];
function update(){
  CUR = filtered();
  renderFacets(); renderStats(CUR);
  if(state.tab==="list") renderList(CUR); else renderPivot(CUR);
}
let qT; $("q").addEventListener("input", e=>{ clearTimeout(qT); qT=setTimeout(()=>{ state.q=e.target.value.trim().toLowerCase(); state.page=0; update(); },160); });
$("clean").addEventListener("change", e=>{ state.clean=e.target.checked; state.page=0; update(); });
function setTab(t){ state.tab=t; $("tab-list").setAttribute("aria-selected",t==="list"); $("tab-pivot").setAttribute("aria-selected",t==="pivot");
  $("view-list").hidden=t!=="list"; $("view-pivot").hidden=t!=="pivot"; if(t==="list") renderList(CUR); else renderPivot(CUR); }
$("tab-list").addEventListener("click",()=>setTab("list")); $("tab-pivot").addEventListener("click",()=>setTab("pivot"));
update();
try{ if(window.claude && window.claude.use){ window.claude.use("downloads").then(d=>{ dl=d; }).catch(()=>{}); } }catch(_){}
})();
</script>
